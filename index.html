<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fare & Distance Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f1c40f; 
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      color: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    h2 {
      margin-bottom: 20px;
      color: #f1c40f;
    }
    .metric-box {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }
    .label {
      font-size: 0.85rem;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }
    .metric {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 5px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      padding: 15px 20px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }
    button:active { transform: scale(0.98); }
    .btn-start { background: #27ae60; color: white; }
    .btn-start:hover { background: #219653; }
    .btn-stop { background: #e74c3c; color: white; display: none; }
    .btn-stop:hover { background: #c0392b; }
    .btn-reset { background: #4a4a4a; color: white; }
    .btn-reset:hover { background: #333333; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚕 Ride Fare Tracker</h2>
    
    <div class="metric-box">
      <div class="label">Distance Traveled</div>
      <div class="metric" id="distance">0.00 km</div>
    </div>
    
    <div class="metric-box">
      <div class="label">Total Fare (₹10 / km)</div>
      <div class="metric" id="fare" style="color: #f1c40f;">₹--.--</div>
    </div>
    
    <div class="btn-group">
      <button class="btn-start" id="startBtn" onclick="startRide()">Start Tracking</button>
      <button class="btn-stop" id="stopBtn" onclick="stopRide()">End Trip</button>
      <button class="btn-reset" id="resetBtn" onclick="resetRide()">Reset</button>
    </div>
  </div>

  <script>
    const RATE_PER_KM = 10;
    let watchId = null;
    let timerId = null;
    let totalDistance = 0;
    let lastCoords = null;

    function getDistanceInKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; 
    }

    // Force notification to show immediately
    function pushNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, {
          body: body,
          tag: 'ride-tracker-notification', // Keeps replacing the same notification card
          renotify: true
        });
      }
    }

    async function startRide() {
      // 1. Force Request Notification Permission
      if ("Notification" in window) {
        const perm = await Notification.requestPermission();
        if (perm !== "granted") {
          alert("Notification permission was denied! Check phone settings.");
          return;
        }
      } else {
        alert("Notifications are not supported on this device.");
        return;
      }

      // 2. Hide Start Button, Show End Trip Button
      document.getElementById('startBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = 'block';
      document.getElementById('fare').innerText = "₹--.--";

      // 3. Immediately trigger first notification popup
      pushNotification("Ride Started 🚕", "Tracking Active. Distance: 0.00 km");

      // 4. Start Timer Interval (forces notification to update every 3 seconds even if stationary)
      timerId = setInterval(() => {
        pushNotification("Ride in Progress 📍", `Distance Traveled: ${totalDistance.toFixed(2)} km`);
      }, 3000);

      // 5. Start GPS tracking
      if ("geolocation" in navigator) {
        watchId = navigator.geolocation.watchPosition(
          updatePosition,
          (err) => console.warn("GPS Warning: " + err.message),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
        );
      }
    }

    function updatePosition(position) {
      const { latitude, longitude } = position.coords;

      if (lastCoords) {
        const distDelta = getDistanceInKm(lastCoords.latitude, lastCoords.longitude, latitude, longitude);
        if (distDelta > 0.003) { // 3 meters movement threshold
          totalDistance += distDelta;
          lastCoords = { latitude, longitude };
        }
      } else {
        lastCoords = { latitude, longitude };
      }

      document.getElementById('distance').innerText = `${totalDistance.toFixed(2)} km`;
    }

    function stopRide() {
      // Clear GPS and Timers
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (timerId !== null) clearInterval(timerId);
      
      watchId = null;
      timerId = null;
      lastCoords = null;

      // Calculate final fare ONLY when stopped
      const finalFare = totalDistance * RATE_PER_KM;
      document.getElementById('fare').innerText = `₹${finalFare.toFixed(2)}`;

      // Switch buttons back
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';

      // Send final stop notification
      pushNotification("Trip Ended 🛑", `Total Distance: ${totalDistance.toFixed(2)} km | Final Fare: ₹${finalFare.toFixed(2)}`);
    }

    function resetRide() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (timerId !== null) clearInterval(timerId);

      watchId = null;
      timerId = null;
      totalDistance = 0;
      lastCoords = null;

      document.getElementById('distance').innerText = "0.00 km";
      document.getElementById('fare').innerText = "₹0.00";

      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';

      pushNotification("Tracker Reset 🔄", "Distance & fare reset to zero.");
    }
  </script>
</body>
</html>
