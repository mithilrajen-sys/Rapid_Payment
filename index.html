<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapido Fare Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f1c40f; 
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      color: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    h2 { margin-bottom: 20px; color: #f1c40f; }
    .metric-box {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }
    .label {
      font-size: 0.85rem;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }
    .metric {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 5px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      padding: 15px 20px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    button:active { transform: scale(0.98); }
    .btn-start { background: #27ae60; color: white; }
    .btn-stop { background: #e74c3c; color: white; display: none; }
    .btn-reset { background: #4a4a4a; color: white; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚕 Rapido Fare Tracker</h2>
    
    <div class="metric-box">
      <div class="label">Distance Traveled</div>
      <div class="metric" id="distance">0.00 km</div>
    </div>
    
    <div class="metric-box">
      <div class="label">Total Fare (₹10 / km)</div>
      <div class="metric" id="fare" style="color: #f1c40f;">₹--.--</div>
    </div>
    
    <div class="btn-group">
      <button class="btn-start" id="startBtn" onclick="startRide()">Start Tracking</button>
      <button class="btn-stop" id="stopBtn" onclick="stopRide()">End Trip</button>
      <button class="btn-reset" id="resetBtn" onclick="resetRide()">Reset</button>
    </div>
  </div>

  <script>
    const RATE_PER_KM = 10;
    let watchId = null;
    let totalDistance = 0;
    let lastCoords = null;
    let swRegistration = null;

    // Register Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => { swRegistration = reg; })
        .catch(err => console.error("SW registration failed:", err));
    }

    // Restore cached state if page reloads
    window.addEventListener('DOMContentLoaded', () => {
      const savedDist = localStorage.getItem('totalDistance');
      if (savedDist) {
        totalDistance = parseFloat(savedDist);
        document.getElementById('distance').innerText = `${totalDistance.toFixed(2)} km`;
      }
      if (localStorage.getItem('isTracking') === 'true') {
        startRide(true);
      }
    });

    function getDistanceInKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; 
    }

    function sendSystemNotification(title, body) {
      if (swRegistration && Notification.permission === "granted") {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({
            type: 'SHOW_NOTIFICATION',
            title: title,
            body: body
          });
        } else {
          swRegistration.showNotification(title, { body: body, tag: 'rapido-tracker-status' });
        }
      }
    }

    async function startRide(isResuming = false) {
      // 1. Force Request Notification Permission
      if ("Notification" in window) {
        const perm = await Notification.requestPermission();
        if (perm !== "granted") {
          alert("Enable notifications in browser settings to see status updates!");
          return;
        }
      }

      if ("geolocation" in navigator) {
        localStorage.setItem('isTracking', 'true');

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        document.getElementById('fare').innerText = "₹--.--";

        // Push immediate starting notification
        sendSystemNotification("Ride Active 🚕", `Distance Traveled: ${totalDistance.toFixed(2)} km`);

        watchId = navigator.geolocation.watchPosition(
          updatePosition,
          (err) => console.warn("GPS Warning:", err.message),
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 }
        );
      }
    }

    function updatePosition(position) {
      const { latitude, longitude } = position.coords;

      if (lastCoords) {
        const distDelta = getDistanceInKm(lastCoords.latitude, lastCoords.longitude, latitude, longitude);
        if (distDelta > 0.003) { // 3 meter movement threshold
          totalDistance += distDelta;
          lastCoords = { latitude, longitude };

          localStorage.setItem('totalDistance', totalDistance);
        }
      } else {
        lastCoords = { latitude, longitude };
      }

      const distText = `${totalDistance.toFixed(2)} km`;
      document.getElementById('distance').innerText = distText;

      // Send Service Worker Notification
      sendSystemNotification("Ride in Progress 📍", `Distance Traveled: ${distText}`);
    }

    function stopRide() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      lastCoords = null;
      localStorage.setItem('isTracking', 'false');

      const finalFare = totalDistance * RATE_PER_KM;
      document.getElementById('fare').innerText = `₹${finalFare.toFixed(2)}`;

      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';

      sendSystemNotification("Trip Ended 🛑", `Total Distance: ${totalDistance.toFixed(2)} km | Final Fare: ₹${finalFare.toFixed(2)}`);
    }

    function resetRide() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      totalDistance = 0;
      lastCoords = null;

      localStorage.removeItem('totalDistance');
      localStorage.removeItem('isTracking');

      document.getElementById('distance').innerText = "0.00 km";
      document.getElementById('fare').innerText = "₹0.00";

      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';

      sendSystemNotification("Tracker Reset 🔄", "Distance and fare reset to zero.");
    }
  </script>
</body>
</html>
