<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fare & Distance Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #eef2f5;
      color: #333;
    }
    .card {
      background: white;
      max-width: 420px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h2 {
      margin-bottom: 20px;
      color: #1a252f;
    }
    .metric-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .label {
      font-size: 0.9rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .metric {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 5px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-start { background: #10b981; color: white; }
    .btn-start:hover { background: #059669; }
    .btn-stop { background: #ef4444; color: white; }
    .btn-stop:hover { background: #dc2626; }
    .btn-test { background: #6366f1; color: white; }
    .btn-test:hover { background: #4f46e5; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Ride Fare Tracker</h2>
    
    <div class="metric-box">
      <div class="label">Distance Traveled</div>
      <div class="metric" id="distance">0.00 km</div>
    </div>
    
    <div class="metric-box">
      <div class="label">Total Fare (₹10 / km)</div>
      <div class="metric" id="fare">₹0.00</div>
    </div>
    
    <div class="btn-group">
      <button class="btn-start" onclick="startRide()">Start Tracking</button>
      <button class="btn-stop" onclick="stopRide()">Stop Tracking</button>
      <button class="btn-test" onclick="testNotification()">Test Notification</button>
    </div>
  </div>

  <script>
    // Fare Configuration: ₹10 per km
    const RATE_PER_KM = 10;

    let watchId = null;
    let totalDistance = 0; // in km
    let lastCoords = null;

    // Haversine formula to compute distance between two GPS coordinates
    function getDistanceInKm(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; 
    }

    // Function to handle showing system notifications with Distance & Fare
    function triggerNotification(dist, fare) {
      if ("Notification" in window && Notification.permission === "granted") {
        const notif = new Notification("Trip Update 📍", {
          body: `Distance: ${dist.toFixed(2)} km | Fare: ₹${fare.toFixed(2)}`,
          tag: "fare-tracker-tag", // Overwrites previous notification so popups don't stack
          renotify: true
        });

        // Clicking notification focuses back to this web app tab
        notif.onclick = function() {
          window.focus();
        };
      }
    }

    async function startRide() {
      // 1. Request Notification Permission
      if ("Notification" in window) {
        if (Notification.permission !== "granted") {
          const perm = await Notification.requestPermission();
          if (perm !== "granted") {
            alert("Please allow notification permissions to see updates!");
          }
        }
      } else {
        alert("Notifications are not supported by this browser.");
      }

      // 2. Start Continuous GPS Tracking with flexible timeout settings
      if ("geolocation" in navigator) {
        watchId = navigator.geolocation.watchPosition(
          updatePosition,
          (err) => {
            console.warn("GPS Notice:", err.message);
            alert("GPS Error: " + err.message);
          },
          { 
            enableHighAccuracy: false, // Prevents strict GPS timeout indoors/desktops
            maximumAge: 3000,          // Accepts position cached within 3 seconds
            timeout: 20000             // 20-second timeout to give location service time to acquire fix
          }
        );
        alert("Tracking started! Move around to track distance.");
      } else {
        alert("Geolocation is not supported on this browser.");
      }
    }

    function updatePosition(position) {
      const { latitude, longitude } = position.coords;

      if (lastCoords) {
        // Calculate incremental distance from previous position
        const distDelta = getDistanceInKm(
          lastCoords.latitude,
          lastCoords.longitude,
          latitude,
          longitude
        );
        
        // Filter out small GPS jitter (under 5 meters)
        if (distDelta > 0.005) {
          totalDistance += distDelta;
          lastCoords = { latitude, longitude };
        }
      } else {
        lastCoords = { latitude, longitude };
      }

      // Calculate total fare (e.g. 4.6 km * 10 = ₹46.00)
      const fare = totalDistance * RATE_PER_KM;

      // Update Screen UI
      document.getElementById('distance').innerText = `${totalDistance.toFixed(2)} km`;
      document.getElementById('fare').innerText = `₹${fare.toFixed(2)}`;

      // Push notification with updated distance & fare
      triggerNotification(totalDistance, fare);
    }

    function stopRide() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        lastCoords = null;
        alert("Tracking stopped.");
      }
    }

    // Manual test to confirm notifications work on your device right now
    async function testNotification() {
      if ("Notification" in window) {
        if (Notification.permission !== "granted") {
          await Notification.requestPermission();
        }
        if (Notification.permission === "granted") {
          triggerNotification(4.60, 46.00); // Test display for 4.6km = ₹46.00
        } else {
          alert("Notification permission is blocked in browser settings.");
        }
      } else {
        alert("Notifications not supported on this browser.");
      }
    }
  </script>
</body>
</html>
