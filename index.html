<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fare & Distance Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #eef2f5;
      color: #333;
    }
    .card {
      background: white;
      max-width: 420px;
      margin: 20px auto;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }
    h2 {
      margin-bottom: 20px;
      color: #1a252f;
    }
    .metric-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .label {
      font-size: 0.9rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .metric {
      font-size: 2.2rem;
      font-weight: 700;
      color: #0f172a;
      margin-top: 5px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 20px;
    }
    button {
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn-start { background: #10b981; color: white; }
    .btn-start:hover { background: #059669; }
    .btn-stop { background: #ef4444; color: white; }
    .btn-stop:hover { background: #dc2626; }
    .btn-reset { background: #64748b; color: white; }
    .btn-reset:hover { background: #475569; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Ride Fare Tracker</h2>
    
    <div class="metric-box">
      <div class="label">Distance Traveled</div>
      <div class="metric" id="distance">0.00 km</div>
    </div>
    
    <div class="metric-box">
      <div class="label">Total Fare (₹10 / km)</div>
      <div class="metric" id="fare">₹--.--</div>
    </div>
    
    <div class="btn-group">
      <button class="btn-start" onclick="startRide()">Start Tracking</button>
      <button class="btn-stop" onclick="stopRide()">Stop Tracking</button>
      <button class="btn-reset" onclick="resetRide()">Reset</button>
    </div>
  </div>

  <script>
    // Rate Configuration: ₹10 per km
    const RATE_PER_KM = 10;

    let watchId = null;
    let totalDistance = 0; // in km
    let lastCoords = null;

    // Haversine formula to compute distance between two GPS points
    function getDistanceInKm(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; 
    }

    function startRide() {
      if ("geolocation" in navigator) {
        // Clear fare display when starting a new trip
        document.getElementById('fare').innerText = "₹--.--";

        watchId = navigator.geolocation.watchPosition(
          updatePosition,
          (err) => console.warn("GPS Error: " + err.message),
          { 
            enableHighAccuracy: false,
            maximumAge: 3000,
            timeout: 20000 
          }
        );
        alert("Tracking started! Fare will calculate when you click 'Stop Tracking'.");
      } else {
        alert("Geolocation is not supported on this browser.");
      }
    }

    function updatePosition(position) {
      const { latitude, longitude } = position.coords;

      if (lastCoords) {
        const distDelta = getDistanceInKm(
          lastCoords.latitude,
          lastCoords.longitude,
          latitude,
          longitude
        );
        
        // Filter out small GPS jitter (under 5 meters)
        if (distDelta > 0.005) {
          totalDistance += distDelta;
          lastCoords = { latitude, longitude };
        }
      } else {
        lastCoords = { latitude, longitude };
      }

      // Update distance only on screen while tracking
      document.getElementById('distance').innerText = `${totalDistance.toFixed(2)} km`;
    }

    function stopRide() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        lastCoords = null;

        // Calculate and reveal final fare ONLY on stop
        const finalFare = totalDistance * RATE_PER_KM;
        document.getElementById('fare').innerText = `₹${finalFare.toFixed(2)}`;
        
        alert("Trip Stopped! Final fare calculated.");
      } else {
        alert("Tracking is not currently active.");
      }
    }

    function resetRide() {
      // Stop tracking if currently active
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      
      // Reset variables & UI
      totalDistance = 0;
      lastCoords = null;
      document.getElementById('distance').innerText = "0.00 km";
      document.getElementById('fare').innerText = "₹0.00";
      
      alert("Tracker has been reset.");
    }
  </script>
</body>
</html>
