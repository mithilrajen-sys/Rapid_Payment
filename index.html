<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fare & Distance Tracker</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 20px;
      /* Yellow background theme */
      background: #f1c40f; 
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      color: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    h2 {
      margin-bottom: 20px;
      color: #f1c40f;
    }
    .metric-box {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }
    .label {
      font-size: 0.85rem;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }
    .metric {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 5px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      padding: 15px 20px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-start { background: #27ae60; color: white; }
    .btn-start:hover:not(:disabled) { background: #219653; }
    .btn-stop { background: #e74c3c; color: white; display: none; } /* Hidden by default */
    .btn-stop:hover { background: #c0392b; }
    .btn-reset { background: #4a4a4a; color: white; }
    .btn-reset:hover { background: #333333; }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚕 Ride Fare Tracker</h2>
    
    <div class="metric-box">
      <div class="label">Distance Traveled</div>
      <div class="metric" id="distance">0.00 km</div>
    </div>
    
    <div class="metric-box">
      <div class="label">Total Fare (₹10 / km)</div>
      <div class="metric" id="fare" style="color: #f1c40f;">₹--.--</div>
    </div>
    
    <div class="btn-group">
      <button class="btn-start" id="startBtn" onclick="startRide()">Start Tracking</button>
      <button class="btn-stop" id="stopBtn" onclick="stopRide()">End Trip</button>
      <button class="btn-reset" id="resetBtn" onclick="resetRide()">Reset</button>
    </div>
  </div>

  <script>
    // Fare Rate Configuration: ₹10 per km
    const RATE_PER_KM = 10;

    let watchId = null;
    let totalDistance = 0; // in km
    let lastCoords = null;

    // Haversine formula to compute distance between two GPS coordinates
    function getDistanceInKm(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth's radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; 
    }

    // Sends mobile background notification showing live distance
    function sendNotification(title, body) {
      if ("Notification" in window && Notification.permission === "granted") {
        const notif = new Notification(title, {
          body: body,
          tag: "mobile-tracker-status", // Overwrites previous notification so popups don't stack
          renotify: true
        });

        notif.onclick = function() {
          window.focus(); // Focuses back to tab on click
        };
      }
    }

    async function startRide() {
      // 1. Request Notification Permission for Mobile Status Bar Updates
      if ("Notification" in window && Notification.permission !== "granted") {
        await Notification.requestPermission();
      }

      // 2. Start Continuous GPS Tracking
      if ("geolocation" in navigator) {
        document.getElementById('fare').innerText = "₹--.--"; // Keep fare hidden

        watchId = navigator.geolocation.watchPosition(
          updatePosition,
          (err) => console.warn("GPS Notice:", err.message),
          { 
            enableHighAccuracy: false,
            maximumAge: 3000,
            timeout: 20000 
          }
        );

        // UI State Change: Disable & Hide "Start Tracking", Show "End Trip"
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        startBtn.disabled = true;
        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';

        sendNotification("Ride Started 🚕", "Distance: 0.00 km | Fare will display when trip ends.");
      } else {
        alert("Geolocation is not supported on this browser.");
      }
    }

    function updatePosition(position) {
      const { latitude, longitude } = position.coords;

      if (lastCoords) {
        const distDelta = getDistanceInKm(
          lastCoords.latitude,
          lastCoords.longitude,
          latitude,
          longitude
        );
        
        // Filter out GPS jitter under 5 meters
        if (distDelta > 0.005) {
          totalDistance += distDelta;
          lastCoords = { latitude, longitude };
        }
      } else {
        lastCoords = { latitude, longitude };
      }

      // Update distance on UI screen
      document.getElementById('distance').innerText = `${totalDistance.toFixed(2)} km`;

      // Update mobile notification with current distance (Fare stays hidden)
      sendNotification("Ride in Progress 📍", `Distance Traveled: ${totalDistance.toFixed(2)} km`);
    }

    function stopRide() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
        lastCoords = null;

        // Calculate and reveal final fare ONLY on stop
        const finalFare = totalDistance * RATE_PER_KM;
        document.getElementById('fare').innerText = `₹${finalFare.toFixed(2)}`;

        // UI State Change: Re-enable "Start Tracking" and Hide "End Trip"
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        startBtn.disabled = false;
        startBtn.style.display = 'block';
        stopBtn.style.display = 'none';

        // Send final notification showing total distance and final fare
        sendNotification("Trip Ended 🛑", `Total Distance: ${totalDistance.toFixed(2)} km | Final Fare: ₹${finalFare.toFixed(2)}`);
      } else {
        alert("Tracking is not currently active.");
      }
    }

    function resetRide() {
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      
      totalDistance = 0;
      lastCoords = null;
      document.getElementById('distance').innerText = "0.00 km";
      document.getElementById('fare').innerText = "₹0.00";

      // UI State Change: Ensure buttons are back to default state
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      startBtn.disabled = false;
      startBtn.style.display = 'block';
      stopBtn.style.display = 'none';

      sendNotification("Tracker Reset 🔄", "Distance and fare reset to zero.");
    }
  </script>
</body>
</html>
