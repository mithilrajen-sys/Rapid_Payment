<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapido Fare Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f1c40f; 
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1a1a1a;
      color: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }
    h2 { margin-bottom: 20px; color: #f1c40f; }
    .metric-box {
      background: #2a2a2a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 15px;
    }
    .label {
      font-size: 0.85rem;
      color: #a0a0a0;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      font-weight: 600;
    }
    .metric {
      font-size: 2.2rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 5px;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    button {
      padding: 15px 20px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.1s ease;
    }
    button:active { transform: scale(0.98); }
    .btn-start { background: #27ae60; color: white; }
    .btn-stop { background: #e74c3c; color: white; display: none; }
    .btn-reset { background: #4a4a4a; color: white; }

    /* Payment Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(5px);
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-content {
      background: #1a1a1a;
      color: #ffffff;
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 380px;
      border: 1px solid #333;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .modal-title {
      font-size: 1.2rem;
      color: #f1c40f;
      margin-bottom: 5px;
    }
    .modal-amount {
      font-size: 1.8rem;
      font-weight: bold;
      color: #27ae60;
      margin-bottom: 20px;
    }
    .bank-option {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-align: left;
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .bank-option:hover {
      background: #333;
      border-color: #f1c40f;
    }
    .bank-name {
      font-weight: bold;
      font-size: 1rem;
      color: #ffffff;
    }
    .bank-upi {
      font-size: 0.8rem;
      color: #a0a0a0;
      margin-top: 3px;
    }

    /* QR Code Display Container */
    .qr-container {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      padding: 20px;
      border-radius: 15px;
      margin-top: 10px;
      margin-bottom: 15px;
    }
    .qr-container img {
      width: 200px;
      height: 200px;
      border-radius: 8px;
    }
    .qr-bank-info {
      color: #1a1a1a;
      font-weight: bold;
      margin-top: 10px;
      font-size: 0.95rem;
    }
    .qr-upi-info {
      color: #666;
      font-size: 0.8rem;
    }

    .modal-close {
      background: transparent;
      border: 1px solid #555;
      color: #aaa;
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      border-radius: 8px;
    }
    .btn-back-banks {
      display: none;
      background: #333;
      border: 1px solid #555;
      color: #f1c40f;
      padding: 10px;
      width: 100%;
      margin-top: 10px;
      border-radius: 8px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🚕 Rapido Fare Tracker</h2>
    
    <div class="metric-box">
      <div class="label">Distance Traveled</div>
      <div class="metric" id="distance">0.00 km</div>
    </div>
    
    <div class="metric-box">
      <div class="label">Total Fare (₹10 / km)</div>
      <div class="metric" id="fare" style="color: #f1c40f;">₹--.--</div>
    </div>
    
    <div class="btn-group">
      <button class="btn-start" id="startBtn" onclick="startRide()">Start Tracking</button>
      <button class="btn-stop" id="stopBtn" onclick="stopRide()">End Trip</button>
      <button class="btn-reset" id="resetBtn" onclick="resetRide()">Reset</button>
    </div>
  </div>

  <!-- Payment Modal -->
  <div class="modal-overlay" id="paymentModal">
    <div class="modal-content">
      <div class="modal-title" id="modalTitle">Select Receiving Bank Account</div>
      <div class="modal-amount" id="modalFareText">₹0.00</div>

      <!-- Bank Options List -->
      <div id="bankList">
        <div class="bank-option" onclick="showQRCode('7339519500@ptyes', 'Indian Bank')">
          <div>
            <div class="bank-name">🏦 Indian Bank</div>
            <div class="bank-upi">7339519500@ptyes</div>
          </div>
          <span style="color:#f1c40f; font-size: 1.2rem;">➔</span>
        </div>

        <div class="bank-option" onclick="showQRCode('rmithil03@okhdfcbank', 'Union Bank')">
          <div>
            <div class="bank-name">🏦 Union Bank</div>
            <div class="bank-upi">rmithil03@okhdfcbank</div>
          </div>
          <span style="color:#f1c40f; font-size: 1.2rem;">➔</span>
        </div>
      </div>

      <!-- Dynamic QR Code View -->
      <div class="qr-container" id="qrContainer">
        <img id="qrImage" src="" alt="UPI QR Code" />
        <div class="qr-bank-info" id="qrBankName">Indian Bank</div>
        <div class="qr-upi-info" id="qrUpiId">7339519500@ptyes</div>
      </div>

      <button class="btn-back-banks" id="backBtn" onclick="showBankList()">Back to Accounts</button>
      <button class="modal-close" onclick="closeModal()">Close</button>
    </div>
  </div>

  <script>
    const RATE_PER_KM = 10;
    let watchId = null;
    let totalDistance = 0;
    let lastCoords = null;
    let swRegistration = null;
    let calculatedFare = 0;

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => { swRegistration = reg; })
        .catch(err => console.error("SW registration failed:", err));
    }

    // Restore cached session
    window.addEventListener('DOMContentLoaded', () => {
      const savedDist = localStorage.getItem('totalDistance');
      if (savedDist) {
        totalDistance = parseFloat(savedDist);
        document.getElementById('distance').innerText = `${totalDistance.toFixed(2)} km`;
      }
      if (localStorage.getItem('isTracking') === 'true') {
        startRide(true);
      }
    });

    function getDistanceInKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c; 
    }

    function sendSystemNotification(title, body) {
      if (swRegistration && Notification.permission === "granted") {
        if (navigator.serviceWorker.controller) {
          navigator.serviceWorker.controller.postMessage({
            type: 'SHOW_NOTIFICATION',
            title: title,
            body: body
          });
        } else {
          swRegistration.showNotification(title, { body: body, tag: 'rapido-tracker-status' });
        }
      }
    }

    async function startRide(isResuming = false) {
      if ("Notification" in window) {
        await Notification.requestPermission();
      }

      if ("geolocation" in navigator) {
        localStorage.setItem('isTracking', 'true');

        document.getElementById('startBtn').style.display = 'none';
        document.getElementById('stopBtn').style.display = 'block';
        document.getElementById('fare').innerText = "₹--.--";

        sendSystemNotification("Ride Active 🚕", `Distance Traveled: ${totalDistance.toFixed(2)} km`);

        watchId = navigator.geolocation.watchPosition(
          updatePosition,
          (err) => console.warn("GPS Warning:", err.message),
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 }
        );
      }
    }

    function updatePosition(position) {
      const { latitude, longitude } = position.coords;

      if (lastCoords) {
        const distDelta = getDistanceInKm(lastCoords.latitude, lastCoords.longitude, latitude, longitude);
        if (distDelta > 0.003) {
          totalDistance += distDelta;
          lastCoords = { latitude, longitude };
          localStorage.setItem('totalDistance', totalDistance);
        }
      } else {
        lastCoords = { latitude, longitude };
      }

      const distText = `${totalDistance.toFixed(2)} km`;
      document.getElementById('distance').innerText = distText;

      sendSystemNotification("Ride in Progress 📍", `Distance Traveled: ${distText}`);
    }

    function stopRide() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      lastCoords = null;
      localStorage.setItem('isTracking', 'false');

      calculatedFare = totalDistance * RATE_PER_KM;
      const formattedFare = `₹${calculatedFare.toFixed(2)}`;
      
      document.getElementById('fare').innerText = formattedFare;
      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';

      sendSystemNotification("Trip Ended 🛑", `Total Distance: ${totalDistance.toFixed(2)} km | Final Fare: ${formattedFare}`);

      // Reset and open modal to Bank List view
      showBankList();
      document.getElementById('modalFareText').innerText = formattedFare;
      document.getElementById('paymentModal').style.display = 'flex';
    }

    function showQRCode(upiId, bankName) {
      const amount = calculatedFare.toFixed(2);
      
      // Standard UPI Payment URI
      const upiString = `upi://pay?pa=${upiId}&pn=${encodeURIComponent(bankName)}&am=${amount}&cu=INR`;
      
      // Generate QR Code image using Google Charts API
      const qrApiUrl = `https://chart.googleapis.com/chart?cht=qr&chs=250x250&chl=${encodeURIComponent(upiString)}`;

      // Update UI
      document.getElementById('qrImage').src = qrApiUrl;
      document.getElementById('qrBankName').innerText = bankName;
      document.getElementById('qrUpiId').innerText = upiId;

      document.getElementById('modalTitle').innerText = "Scan QR Code to Pay";
      document.getElementById('bankList').style.display = 'none';
      document.getElementById('qrContainer').style.display = 'flex';
      document.getElementById('backBtn').style.display = 'block';
    }

    function showBankList() {
      document.getElementById('modalTitle').innerText = "Select Receiving Bank Account";
      document.getElementById('bankList').style.display = 'block';
      document.getElementById('qrContainer').style.display = 'none';
      document.getElementById('backBtn').style.display = 'none';
    }

    function closeModal() {
      document.getElementById('paymentModal').style.display = 'none';
      showBankList();
    }

    function resetRide() {
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      watchId = null;
      totalDistance = 0;
      lastCoords = null;

      localStorage.removeItem('totalDistance');
      localStorage.removeItem('isTracking');

      document.getElementById('distance').innerText = "0.00 km";
      document.getElementById('fare').innerText = "₹0.00";

      document.getElementById('startBtn').style.display = 'block';
      document.getElementById('stopBtn').style.display = 'none';

      sendSystemNotification("Tracker Reset 🔄", "Distance and fare reset to zero.");
    }
  </script>
</body>
</html>
